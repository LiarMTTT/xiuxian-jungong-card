name: Deploy map preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/map-preview-pages.yml'
      - 'map-preview/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean frontend
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build player map site
        shell: bash
        env:
          SOURCE_BASE: https://xiuxian-map-preview.alsdmttt.chatgpt.site
        run: |
          set -euo pipefail

          mkdir -p _site/preview/vendor
          mkdir -p _site/dist/data _site/dist/layers _site/dist/previews _site/dist/seasons _site/dist/tiles

          fetch_asset() {
            local path="$1"
            mkdir -p "_site/$(dirname "$path")"
            curl --fail --location --silent --show-error \
              --retry 5 --retry-delay 2 --retry-all-errors \
              "$SOURCE_BASE/$path" -o "_site/$path"
          }

          for path in \
            preview/styles.css \
            preview/vendor/leaflet.css \
            preview/vendor/leaflet.js \
            preview/vendor/LEAFLET-LICENSE \
            dist/data/map-data.json \
            dist/tiles/manifest.json \
            dist/layers/boundaries.svg \
            dist/layers/hydrology.svg \
            dist/layers/labels.svg \
            dist/layers/map-master-8192x5461.svg \
            dist/layers/nodes.svg \
            dist/layers/regions.svg \
            dist/layers/roads.svg \
            dist/layers/routes.svg \
            dist/layers/sea-routes.svg
          do
            fetch_asset "$path"
          done

          install -m 0644 map-preview/app.js _site/preview/app.js

          for season in spring summer autumn winter
          do
            fetch_asset "dist/previews/map-${season}-terrain-8192x5461-preview-1024.webp"
            fetch_asset "dist/seasons/map-${season}-terrain-8192x5461.webp"
          done

          python3 - <<'PY'
          from base64 import b64encode
          from pathlib import Path

          source = Path("map-preview/index.html").read_text(encoding="utf-8")
          image = b64encode(
              Path("_site/dist/previews/map-spring-terrain-8192x5461-preview-1024.webp").read_bytes()
          ).decode("ascii")
          fallback = """
              <style id="instant-map-fallback">
                .map-placeholder {
                  background:
                    linear-gradient(rgba(4, 13, 11, .18), rgba(4, 13, 11, .38)),
                    url("data:image/webp;base64,__SPRING_PREVIEW__") center / contain no-repeat #07110f !important;
                }
                .placeholder-content {
                  padding: 12px 16px;
                  border: 1px solid rgba(210, 180, 125, .16);
                  border-radius: 10px;
                  background: rgba(5, 15, 12, .72);
                  backdrop-filter: blur(8px);
                }
              </style>
          """.replace("__SPRING_PREVIEW__", image)
          preview = source.replace("  </head>", f"{fallback}\n  </head>", 1)
          root = preview.replace("  <head>", '  <head>\n    <base href="./preview/" />', 1)
          Path("_site/preview/index.html").write_text(preview, encoding="utf-8")
          Path("_site/index.html").write_text(root, encoding="utf-8")
          PY

          download_tile() {
            local season="$1"
            local z="$2"
            local x="$3"
            local y="$4"
            fetch_asset "dist/tiles/$season/$z/$x/$y.webp"
          }
          export -f fetch_asset download_tile
          export SOURCE_BASE

          {
            for season in spring summer autumn winter
            do
              for spec in "0 1 1" "1 2 2" "2 4 3" "3 8 6" "4 16 11"
              do
                read -r z x_count y_count <<< "$spec"
                for ((x=0; x<x_count; x++))
                do
                  for ((y=0; y<y_count; y++))
                  do
                    printf '%s %s %s %s\n' "$season" "$z" "$x" "$y"
                  done
                done
              done
            done
          } | xargs -n 4 -P 16 bash -c 'download_tile "$@"' _

          touch _site/.nojekyll
          printf '%s\n' 'xiuxian-pages-ok direct-map-2' > _site/health.txt
          test "$(find _site/dist/tiles -type f -name '*.webp' | wc -l)" -eq 964
          node --check _site/preview/app.js
          test "$(wc -c < _site/preview/index.html)" -gt 150000
          test "$(wc -c < _site/index.html)" -gt 150000
          grep -Fq '<base href="./preview/" />' _site/index.html
          grep -Fq 'data:image/webp;base64,' _site/preview/index.html
          jq empty _site/dist/data/map-data.json
          ! grep -E '__CF[$]cv|/cdn-cgi/challenge-platform' _site/index.html _site/preview/index.html
          ! grep -E '龙曦|无名沉渊|dragonCanon|east-sea-nameless-deep' _site/dist/data/map-data.json

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
